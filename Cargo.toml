# Lints are declared in the manifest rather than passed on the command line, for two reasons: rust-analyzer
# then shows the same ones the gate enforces while you are editing, and a linter permitted here is a
# decision somebody wrote down rather than an `#[allow]` scattered through generated code.
#
# They sit at "warn" locally; `npm run check` runs clippy with `-D warnings`, so anything that warns
# fails the gate. To permit one, add it below with a comment saying why.
[lints.clippy]
# priority = -1 lets an individual lint added below override the group; Cargo rejects the combination
# without it.
pedantic = { level = "warn", priority = -1 }

# Off, and this is the one lint in the group that is systematically wrong for this codebase.
#
# esp-hal reserves a peripheral by moving it out of `Peripherals`, and the idiom is a binding whose
# only job is to be that move: `let _gpio24 = peripherals.GPIO24;`. The lint is correct that the
# binding has no effect — the peripherals are dropped at the end of `main` either way — and wrong
# about what the line is for. It is generated into `src/bin/main.rs` by esp-generate, so an `#[allow]`
# at the use site would be erased on the next regeneration; the only place a permission survives is
# here.
no_effect_underscore_binding = "allow"

[lints.rust]
# Every public item needs a doc comment. In this crate that currently means the crate roots — the
# firmware has no public API — so the lint reads as three demands to document a file rather than as a
# rule about an API. It is kept because the first library module written here is exactly the case it
# was for, and deleting the lint later is easier to notice than adding it.
missing_docs = "warn"

[lints.rustdoc]
# Set to "deny" rather than "warn" so a broken intra-doc link fails `npm run check` on its own: the
# doc step needs no -D flag, which is the same reason these are not in [lints.rust].
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"

[package]
edition      = "2024"
name         = "esp-poc"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "esp-poc"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["defmt", "esp32c6"] }


defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32c6"] }

critical-section = "1.2.0"
esp-backtrace = { version = "0.20.0", features = [
  "defmt",
  "esp32c6",
  "panic-handler",
] }
esp-println = { version = "0.18.0", features = ["defmt-espflash", "esp32c6"] }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
