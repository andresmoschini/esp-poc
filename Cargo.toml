# Lints are declared in the manifest rather than passed on the command line, for two reasons: rust-analyzer
# then shows the same ones the gate enforces while you are editing, and a linter permitted here is a
# decision somebody wrote down rather than an `#[allow]` scattered through generated code.
#
# They sit at "warn" locally; `npm run check` runs clippy with `-D warnings`, so anything that warns
# fails the gate. To permit one, add it below with a comment saying why.
[lints.clippy]
# priority = -1 lets an individual lint added below override the group; Cargo rejects the combination
# without it.
pedantic = { level = "warn", priority = -1 }

# Off, and this is the one lint in the group that is systematically wrong for this codebase.
#
# esp-hal reserves a peripheral by moving it out of `Peripherals`, and the idiom is a binding whose
# only job is to be that move: `let _gpio24 = peripherals.GPIO24;`. The lint is correct that the
# binding has no effect — the peripherals are dropped at the end of `main` either way — and wrong
# about what the line is for. It is generated into `src/bin/main.rs` by esp-generate, so an `#[allow]`
# at the use site would be erased on the next regeneration; the only place a permission survives is
# here.
no_effect_underscore_binding = "allow"

[lints.rust]
# Every public item needs a doc comment. In this crate that currently means the crate roots — the
# firmware has no public API — so the lint reads as three demands to document a file rather than as a
# rule about an API. It is kept because the first library module written here is exactly the case it
# was for, and deleting the lint later is easier to notice than adding it.
missing_docs = "warn"

[lints.rustdoc]
# Set to "deny" rather than "warn" so a broken intra-doc link fails `npm run check` on its own: the
# doc step needs no -D flag, which is the same reason these are not in [lints.rust].
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"

# The one crate in the tree that can be tested: no dependencies, `#![no_std]`, and nothing in it that
# needs a chip. It is a member rather than a module because nothing in `src/` can be compiled for a
# host — all four modules depend on `esp-hal`, on the network stack, or on a scheduler that exists
# only for this chip — so a test on them would need a board. The gate's `test-firmware` step builds
# this crate for the host and runs its tests there.
#
# This block is not esp-generate's. See CONTRIBUTING.md, "Re-running esp-generate": regenerating
# rewrites this file, and a manifest without the workspace still builds the firmware — the failure is
# that the crate stops being a member, the firmware loses its dependency on it, and both parts of the
# gate stop running any tests at all.
[workspace]
members = ["crates/poc-report"]

[package]
edition      = "2024"
name         = "esp-poc"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "esp-poc"
path = "./src/bin/main.rs"

# Which chip to build for, as a feature rather than a second branch.
#
# Every one of the seven Espressif dependencies below has an `esp32c3` and an `esp32c6` feature, and
# none of the other seven has a chip feature at all, so the whole selection is these two lists. The
# rule is one line per direct dependency that has a chip feature — not the shortest list that happens
# to work. They do forward transitively (`esp-radio/esp32c3` reaches `esp-hal/esp32c3`), but two of
# those edges are gated on an optional dependency this package does not enable, and an edge that
# disappears in a patch release would take the chip with it.
#
# `default` has to name the same chip as `[build] target` in `.cargo/config.toml`, and Cargo offers no
# way to check that: it will not read a configuration value out of a feature, nor a feature out of a
# manifest it is already reading. `tools/lib/chip.mjs` holds the pairing and the gate's `chips` step is
# what compares the two files, because the failure otherwise is `esp-metadata` saying the target is
# wrong, or a missing `Peripherals` field, neither of which names what to change.
#
# Anything outside this repository that is about a chip rather than about the code — the triple in
# `rust-toolchain.toml`, the `runner` in `.cargo/config.toml`, the reserved pins in `src/bin/main.rs`
# behind `#[cfg(feature = ...)]` — is listed there instead of here.
[features]
default = ["esp32c3"]
esp32c3 = [
  "esp-hal/esp32c3",
  "esp-alloc/esp32c3",
  "esp-backtrace/esp32c3",
  "esp-bootloader-esp-idf/esp32c3",
  "esp-println/esp32c3",
  "esp-radio/esp32c3",
  "esp-rtos/esp32c3",
]
esp32c6 = [
  "esp-hal/esp32c6",
  "esp-alloc/esp32c6",
  "esp-backtrace/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
  "esp-println/esp32c6",
  "esp-radio/esp32c6",
  "esp-rtos/esp32c6",
]

[dependencies]
# `unstable` is not optional for this firmware any more. The Wi-Fi peripheral singleton is behind it on
# the `esp32c6` and the hardware RNG that seeds the network stack is behind it on the `esp32c3`, and
# there is no stable API for Wi-Fi on either chip. Every new `unstable` API used is one more thing a
# future `esp-hal` may rename, so prefer the stable surface where one exists. The chip itself is the
# feature above, not here.
esp-hal = { version = "~1.2.2", features = ["defmt", "unstable"] }

# `ip_in_core` is what makes `defmt` know how to print the `core::net` address types the network
# stack hands back, which are the same types `core` uses.
defmt                  = { version = "1.0.1", features = ["ip_in_core"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt"] }

critical-section = "1.2.0"
esp-backtrace = { version = "0.20.0", features = [
  "defmt",
  "panic-handler",
] }
esp-println = { version = "0.18.0", features = ["defmt-espflash"] }

# The proof of concept: Wi-Fi.
#
# `esp-radio` drives the radio, and needs three things this project did not have before: a preemptive
# scheduler (`esp-rtos`), a heap (`esp-alloc`, which is why the firmware is no longer heap-free), and
# an executor for the async API the driver exposes (`embassy`). The TCP/IP stack that hands out the
# DHCP address is `embassy-net`, which runs on the same executor.
#
# The version is pinned exactly, and the two `opt-level = 3` overrides below are not noise: the radio
# blobs need level 2 or 3 whatever the profile says, and without them Wi-Fi fails to connect for
# reasons that look like a bug in the code above.
esp-radio       = { version = "=1.0.0-beta.1", features = ["defmt", "wifi"] }
esp-rtos        = { version = "0.4.0", features = [
  "defmt",
  "embassy",
  "esp-radio",
] }
esp-alloc       = "0.11.0"
embassy-executor = "0.10.0"
# `defmt` is what makes the stack's own error types printable, `dns` and `udp` are what `src/ntp.rs`
# asks the stack for — without them there is no resolver to turn a server's name into an address, and
# no way to send it a datagram. The `dns` and `udp` features are also a socket each out of the
# fixed-size set that `SOCKETS` in `src/wifi.rs` sizes.
embassy-net     = { version = "0.9.0", features = [
  "defmt",
  "dhcpv4",
  "dns",
  "medium-ethernet",
  "udp",
] }
embassy-time    = "0.5.0"
# `nightly` is what turns on `make_static!`, which is one of the reasons the toolchain is pinned
# rather than left to track stable. The alternative is a hand-rolled macro around `StaticCell`, which
# is what esp-hal's own examples do while their toolchain is stable.
static_cell     = { version = "2.1.0", features = ["nightly"] }

# The sentences the firmware prints about the network, and the address it prints them with. The only
# dependency here that is not firmware: it has none of its own, which is what lets it be built for the
# host and tested there. See `crates/poc-report`.
poc-report = { path = "crates/poc-report" }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

# The radio blobs are the one thing that does not work at "s": they need optimization level 2 or 3
# whatever the profile says, and a connection that fails with no obvious reason is what you get
# without this. It is a per-package override, so the rest of the debug build stays small.
[profile.dev.package.esp-radio]
opt-level = 3

# Same reason, same override. Without this one the release build would be the profile where Wi-Fi
# quietly does not work, which is the worst place for it to happen.
[profile.release.package.esp-radio]
opt-level = 3

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
