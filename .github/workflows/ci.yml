# CI runs the quality gate and nothing else. If this file ever grows a check of its own, the gate a
# person runs before committing and the gate CI runs can disagree, and then "green" means two
# different things.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run the gate by hand. Carried over from the workflow this file replaces, and it earns its place
  # twice over: to check a branch before it is pushed, and to check the repository against a nightly
  # that has not been released yet, which is the one case where the pin in rust-toolchain.toml is
  # stale on purpose rather than by accident.
  workflow_dispatch:

# The gate only reads the repository.
permissions:
  contents: read

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Without this, cargo decides from whether it thinks it has a terminal, and in CI it does not — so
  # a clippy diagnostic arrives as an undifferentiated wall of `--> src/bin/main.rs:44:9`. The gate
  # runs three cargo steps that each produce a page of those — once per chip, so six — and a gate you
  # cannot read is a
  # gate nobody fixes.
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          # The version comes from .nvmrc so it is pinned in one place, the same way the Rust toolchain
          # is.
          node-version-file: .nvmrc
          cache: npm

      # Reads rust-toolchain.toml and installs exactly what it names: the pinned nightly, the
      # components the gate's fmt and clippy steps run, and both chips' targets. Spelled out rather than
      # left to the toolchain being installed on first use, because rustup now reports that behavior
      # as deprecated.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # The cache this project needs most, and the reason is `build-std` in .cargo/config.toml. The
      # standard library is compiled from source, so an uncached run builds 152 crates for the chip —
      # `core` itself included — and leaves roughly 360 MB under target/. That is paid on every single
      # run otherwise, and paid twice over because the gate builds in both the debug and release
      # profiles.
      #
      # It is also paid twice for a different reason: the gate builds every `cargo` step once per chip,
      # so a warm cache has to hold artifacts for two target triples rather than one. The cache key
      # includes the compiler and this file, so both chips' artifacts live under one key and neither
      # evicts the other.
      #
      # No `toolchain:` input is given on purpose. rust-cache reads rust-toolchain.toml when the input
      # is absent, and giving it a channel as well means two places deciding which compiler runs —
      # which is the disagreement this repository's gate exists to prevent. The pin is also what makes
      # the cache key correct: the key includes the compiler version, so a nightly bump misses the
      # cache rather than restoring artifacts built by a different rustc.
      - name: Enable caching
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install the Node tooling
        run: npm run setup

      - name: Run the quality gate
        run: npm run check
